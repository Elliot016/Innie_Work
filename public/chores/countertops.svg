<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <rect width="1000" height="1000" fill="white"/>

  <!-- Counter top surface (3/4 view) -->
  <path d="M 80,520 L 920,520 L 860,455 L 140,455 Z"
    fill="white" stroke="#111" stroke-width="24" stroke-linejoin="round"/>

  <!-- Counter front face -->
  <path d="M 80,520 L 920,520 L 920,700 L 80,700 Z"
    fill="white" stroke="#111" stroke-width="24" stroke-linejoin="round"/>

  <!-- Cabinet door left -->
  <rect x="108" y="534" width="370" height="148" rx="8"
    fill="white" stroke="#111" stroke-width="16"/>

  <!-- Cabinet door right -->
  <rect x="502" y="534" width="390" height="148" rx="8"
    fill="white" stroke="#111" stroke-width="16"/>

  <!-- Cabinet handle left -->
  <path d="M 278,590 L 278,628" stroke="#111" stroke-width="16" stroke-linecap="round"/>

  <!-- Cabinet handle right -->
  <path d="M 692,590 L 692,628" stroke="#111" stroke-width="16" stroke-linecap="round"/>

  <!-- Spray bottle body -->
  <path d="M 690,340 L 690,455 L 775,455 L 775,340 Q 775,315 752,315 L 713,315 Q 690,315 690,340 Z"
    fill="white" stroke="#111" stroke-width="20" stroke-linejoin="round"/>

  <!-- Spray bottle neck -->
  <rect x="714" y="255" width="38" height="62" rx="8"
    fill="white" stroke="#111" stroke-width="20"/>

  <!-- Spray trigger -->
  <path d="M 714,285 Q 696,300 694,330 L 718,330 L 718,292"
    fill="white" stroke="#111" stroke-width="18" stroke-linejoin="round"/>

  <!-- Nozzle -->
  <line x1="714" y1="268" x2="665" y2="268"
    stroke="#111" stroke-width="18" stroke-linecap="round"/>

  <!-- Sparkle 1 (large) -->
  <g transform="translate(330,330)">
    <line x1="0" y1="-40" x2="0" y2="40" stroke="#111" stroke-width="16" stroke-linecap="round"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#111" stroke-width="16" stroke-linecap="round"/>
    <line x1="-27" y1="-27" x2="27" y2="27" stroke="#111" stroke-width="11" stroke-linecap="round"/>
    <line x1="27" y1="-27" x2="-27" y2="27" stroke="#111" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- Sparkle 2 (medium) -->
  <g transform="translate(510,290)">
    <line x1="0" y1="-28" x2="0" y2="28" stroke="#111" stroke-width="13" stroke-linecap="round"/>
    <line x1="-28" y1="0" x2="28" y2="0" stroke="#111" stroke-width="13" stroke-linecap="round"/>
    <line x1="-19" y1="-19" x2="19" y2="19" stroke="#111" stroke-width="9" stroke-linecap="round"/>
    <line x1="19" y1="-19" x2="-19" y2="19" stroke="#111" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Sparkle 3 (small) -->
  <g transform="translate(190,320)">
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#111" stroke-width="13" stroke-linecap="round"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#111" stroke-width="13" stroke-linecap="round"/>
  </g>
</svg>
