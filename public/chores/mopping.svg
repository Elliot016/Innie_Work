<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <rect width="1000" height="1000" fill="white"/>

  <!-- Water puddle (behind mop head) -->
  <ellipse cx="450" cy="845" rx="265" ry="62"
    fill="white" stroke="#111" stroke-width="22"/>

  <!-- Mop handle (angled, upper-right to lower-left) -->
  <line x1="710" y1="75" x2="380" y2="725"
    stroke="#111" stroke-width="26" stroke-linecap="round"/>

  <!-- Handle grip knob at top -->
  <ellipse cx="710" cy="76" rx="32" ry="32"
    fill="white" stroke="#111" stroke-width="22"/>

  <!-- Grip wrap ridges -->
  <line x1="667" y1="148" x2="698" y2="88" stroke="#111" stroke-width="17" stroke-linecap="round"/>
  <line x1="650" y1="185" x2="681" y2="125" stroke="#111" stroke-width="17" stroke-linecap="round"/>
  <line x1="633" y1="222" x2="664" y2="162" stroke="#111" stroke-width="17" stroke-linecap="round"/>

  <!-- Mop head connector bar -->
  <path d="M 332,728 Q 328,742 338,752 L 552,752 Q 562,742 558,728 L 332,728 Z"
    fill="white" stroke="#111" stroke-width="22" stroke-linejoin="round"/>

  <!-- Mop strings (wavy lines hanging from bar) -->
  <path d="M 345,752 Q 322,790 328,845" fill="none" stroke="#111" stroke-width="15" stroke-linecap="round"/>
  <path d="M 370,754 Q 352,792 358,848" fill="none" stroke="#111" stroke-width="15" stroke-linecap="round"/>
  <path d="M 396,756 Q 382,794 388,850" fill="none" stroke="#111" stroke-width="15" stroke-linecap="round"/>
  <path d="M 422,757 Q 413,796 418,851" fill="none" stroke="#111" stroke-width="15" stroke-linecap="round"/>
  <path d="M 448,757 Q 445,796 450,851" fill="none" stroke="#111" stroke-width="15" stroke-linecap="round"/>
  <path d="M 474,756 Q 477,795 482,850" fill="none" stroke="#111" stroke-width="15" stroke-linecap="round"/>
  <path d="M 500,754 Q 510,792 514,848" fill="none" stroke="#111" stroke-width="15" stroke-linecap="round"/>
  <path d="M 526,750 Q 542,788 544,843" fill="none" stroke="#111" stroke-width="15" stroke-linecap="round"/>
  <path d="M 548,745 Q 568,780 568,837" fill="none" stroke="#111" stroke-width="15" stroke-linecap="round"/>

  <!-- Water droplets -->
  <!-- Drop 1 -->
  <path d="M 635,610 Q 652,582 669,610 Q 652,636 635,610 Z"
    fill="white" stroke="#111" stroke-width="17"/>
  <!-- Drop 2 -->
  <path d="M 672,695 Q 686,670 700,695 Q 686,718 672,695 Z"
    fill="white" stroke="#111" stroke-width="15"/>
  <!-- Drop 3 -->
  <path d="M 595,685 Q 607,662 619,685 Q 607,706 595,685 Z"
    fill="white" stroke="#111" stroke-width="15"/>
</svg>
